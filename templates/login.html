{% extends 'base.html' %}
{% block title %}Tuning - Iniciar Sesión{% endblock %}
{% block content %}
    <section class="login-container max-w-md mx-auto bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg mt-8">
        <h1 class="text-3xl font-bold text-center mb-6">Iniciar Sesión</h1>
        {% if error %}
            <p class="text-red-500 text-center mb-4">{{ error }}</p>
        {% endif %}
        <form method="POST" action="/login">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium mb-2">Correo Electrónico</label>
                <input type="email" id="email" name="email" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-medium mb-2">Contraseña</label>
                <input type="password" id="password" name="password" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">Iniciar Sesión</button>
        </form>
        <p class="text-center mt-4">¿No tienes una cuenta? <a href="/register" class="text-blue-500 hover:underline">Regístrate</a></p>
    </section>
{% endblock %}
