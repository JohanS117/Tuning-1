```html
{% extends 'base.html' %}
{% block title %}Tuning - Subir Canción{% endblock %}
{% block content %}
<div class="p-6">
    <h1 class="text-3xl font-bold mb-6">Subir Canción</h1>

    {% if error %}
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST" enctype="multipart/form-data" class="space-y-4">
        {{ form.hidden_tag() }}
        <div>
            <label for="title" class="block text-gray-700 dark:text-gray-300">Título de la Canción</label>
            <input type="text" name="title" id="title" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" required>
        </div>
        <div>
            <label for="song_file" class="block text-gray-700 dark:text-gray-300">Archivo de Audio (MP3 o WAV)</label>
            <input type="file" name="song_file" id="song_file" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600 dark:text-white" accept=".mp3,.wav" required>
        </div>
        <button type="submit" class="bg-blue-500 text-white py-2 px-4 rounded hover:bg-blue-600">Subir</button>
    </form>
</div>
{% endblock %}
```
