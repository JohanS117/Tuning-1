<div id="section-content">
    <div class="p-6 rounded-lg shadow song-card">
        <h2 class="text-2xl font-semibold mb-4">GeoTendencias</h2>
        <div class="mb-4">
            <button class="bg-blue-500 text-white py-1 px-2 rounded mr-2 hover:bg-blue-600 transition" onclick="zoomMap('in')">Zoom In</button>
            <button class="bg-blue-500 text-white py-1 px-2 rounded hover:bg-blue-600 transition" onclick="zoomMap('out')">Zoom Out</button>
        </div>
        <iframe id="geotend-map" src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d591.1579626447129!2d-74.06921568585344!3d4.626022454662798!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8e3f9987639130ed%3A0xf29d33d82824635f!2sUniversidad%20Cooperativa!5e0!3m2!1ses!2sco!4v1741371719793!5m2!1ses!2sco" width="100%" height="400" style="border:0;" allowfullscreen="" loading="lazy" tabindex="0"></iframe>
    </div>
</div>
<script>
    function zoomMap(direction) {
        const iframe = document.getElementById('geotend-map');
        const contentWindow = iframe.contentWindow;
        contentWindow.postMessage(direction === 'in' ? 'zoomIn' : 'zoomOut', '*');
    }
</script>
